name: Refresh stats card

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render stats.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: python3 scripts/stats.py

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain stats.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.svg
            git commit -m "Refresh the stats card"
            git push
          else
            echo "No change."
          fi
