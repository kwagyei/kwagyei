    <rect x="58" y="102" width="72" height="4" rx="2" fill="url(#rule)"/>
    <text x="58" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#dbeafe" opacity="0.95">I build things here every now and then.</text>
